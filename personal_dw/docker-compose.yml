version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: personal_dw_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: personal_dw
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_dw"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
